[package]
name = "ostp-gui"
version = "0.4.7"
description = "OSTP desktop GUI"
authors = ["ospab"]
edition = "2021"
license = "AGPL-3.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ostp_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
ostp-client = { path = "../../ostp-client" }
ostp-ssh = { path = "../../ostp-ssh" }
# The master key that seals saved SSH passwords and keys: Windows Credential
# Manager, Secret Service (pure-Rust zbus), macOS Keychain.
keyring = "4"
portable-atomic = "1"
json_comments = "0.2"
rand = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Reading a QR code from a picture (first-run screen): pure Rust, and only the
# image formats a screenshot or a phone photo comes in.
rqrr = { version = "0.9", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
base64 = "0.22"

rlimit = "0.11.0"
