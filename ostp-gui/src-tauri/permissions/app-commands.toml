[[permission]]
identifier = "allow-app-commands"
description = "Enables access to core OSTP commands"

[permission.commands]
allow = [
  "start_tunnel",
  "stop_tunnel",
  "get_tunnel_status",
  "get_metrics",
  "get_config",
  "save_config",
  "get_wintun_install_path",
  "set_autostart",
  "get_autostart",
  "reload_tunnel",
  "list_running_processes",
  "generate_qr",
  "fetch_subscription",
  "run_prober_matrix",
  "run_prober_ttl",
  "run_dpi_battery",
  "app_build_tag",
  "check_updates"
]
