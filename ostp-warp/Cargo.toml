[package]
name = "ostp-warp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cloudflare WARP as the exit of an OSTP server: registration, a user-space WireGuard client and a local SOCKS5 proxy (TCP and UDP) over it"

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "net", "io-util", "macros"] }
tracing.workspace = true
rand.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
bytes.workspace = true
# The WireGuard protocol only (no tun device, no sockets of its own).
boringtun = { version = "0.7", default-features = false }
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
simple-dns = "0.11.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
# Only for `testpeer`, the stand-in for Cloudflare used by tests (here and in ostp-server).
netstack-smoltcp = { version = "0.2.2", optional = true }
futures = { version = "0.3.32", optional = true }

[features]
testing = ["dep:netstack-smoltcp", "dep:futures"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
netstack-smoltcp = "0.2.2"
futures = "0.3.32"
