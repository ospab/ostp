[package]
name = "ostp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OSTP protocol core: Noise handshake, header obfuscation, framing, ARQ, congestion control, share links"
repository.workspace = true

[features]
# `std` (default) is the desktop/server build: snow for Noise, rand/std clocks.
# Without it the crate is `no_std + alloc`: call `sys::install` once at start-up
# with a monotonic clock, a wall clock and an entropy source; the Noise
# handshake then uses the in-crate implementation (`crypto::noise_lite`).
default = ["std"]
std = [
    "dep:snow", "dep:rand", "dep:sha1", "serde/std", "serde_json/std", "base64/std",
    "anyhow/std", "bytes/std", "chacha20poly1305/std", "sha2/std", "hmac/std",
    "percent-encoding/std", "tracing/std",
]

[dependencies]
anyhow = { version = "1.0", default-features = false }
bytes = { version = "1.6", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
blake2 = { version = "0.10", default-features = false }
tracing = { version = "0.1", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
hkdf = { version = "0.12.0", default-features = false }
percent-encoding = { version = "2", default-features = false, features = ["alloc"] }
libm = "0.2"

snow = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sha1 = { version = "0.10", optional = true }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
