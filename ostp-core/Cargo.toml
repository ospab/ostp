[package]
name = "ostp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OSTP protocol core: Noise handshake, header obfuscation, framing, ARQ, congestion control, share links"
repository.workspace = true

[features]
# The tokio adapter for WebSocket framing (websocket::WsStream).
io = ["dep:tokio"]

[dependencies]
tokio = { workspace = true, optional = true }
anyhow.workspace = true
bytes.workspace = true
chacha20poly1305.workspace = true
rand.workspace = true
snow.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
hmac.workspace = true
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
hkdf = "0.12.0"
# ChaCha20 for header protection (RFC 9001 §5.4.4); the same crate chacha20poly1305 uses.
chacha20 = "0.9"
sha1 = "0.10"
base64 = "0.22"
percent-encoding = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
