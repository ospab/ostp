name: Nightly

# Every push to alpha builds the full release matrix (all platforms +
# Android) and republishes the rolling "nightly" prerelease, so work in
# progress can be tested from real artifacts without cutting a version.
run-name: "Nightly: alpha @ ${{ github.sha }}"

on:
  push:
    branches: [alpha]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "ostp.wiki"
  workflow_dispatch:

# A newer push supersedes a build still running for an older commit.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/release.yml
    with:
      channel: nightly
      ref: ${{ github.sha }}
    secrets: inherit
