[package]
name = "ostp"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "The ostp command: CLI, setup wizard and the client/server daemon of the Ospab Stealth Transport Protocol"
repository.workspace = true

[dependencies]
ostp-client = { path = "../ostp-client" }
ostp-server = { path = "../ostp-server" }
ostp-dns = { path = "../ostp-dns" }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
json_comments = "0.2"
base64 = "0.22"
rand.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ostp-core = { path = "../ostp-core" }
colored = "2.1"
qrcode = { version = "0.14", default-features = false }
rlimit = "0.11.0"
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
# GetUserDefaultUILanguage, for the language of `ostp changelog`.
winapi = { version = "0.3.9", features = ["winnls"] }

# WARP is not built for MIPS (see ostp-server/src/warp.rs).
[target.'cfg(not(any(target_arch = "mips", target_arch = "mips64")))'.dependencies]
ostp-warp = { path = "../ostp-warp" }

[target.'cfg(not(any(target_arch = "mips", target_arch = "mips64")))'.dev-dependencies]
boringtun = { version = "0.7", default-features = false }
ostp-warp = { path = "../ostp-warp", features = ["testing"] }

[dev-dependencies]
bytes.workspace = true
portable-atomic.workspace = true
tokio.workspace = true
