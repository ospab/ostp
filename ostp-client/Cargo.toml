[package]
name = "ostp-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OSTP client: local SOCKS5/HTTP proxy, TUN mode, UDP/UoT/TLS transports, roaming, network prober"
repository.workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
ostp-core = { path = "../ostp-core", features = ["io"] }
ostp-tun = { path = "../ostp-tun" }
rand.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json_comments = "0.2"
portable-atomic.workspace = true
chrono = "0.4"
socket2 = "0.6.3"
futures-util = "0.3.32"
hmac = "0.12.1"
sha2 = "0.10.8"
base64 = "0.22.1"
webpki-roots = "1"
# ring only: aws-lc-rs (rustls' default) does not build for Android and every release target.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
httparse = "1"
idna = "1"
tun = { version = "0.8.9", features = ["async"] }
netstack-smoltcp = "0.2.2"
futures = "0.3.32"
libc = "0.2.186"
winapi = { version = "0.3.9", features = ["iphlpapi", "tcpmib", "udpmib", "winbase", "processthreadsapi", "psapi", "handleapi", "winerror", "minwindef", "winnt", "iptypes", "ws2def"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
